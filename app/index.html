<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06251B">
<title>Protein Tadka — Built on Protein. Powered by Tadka.</title>
<meta name="description" content="High-protein chicken bowls, guilt-free tadka mac, lean salads & 200g tofu power bowls. 42–60g protein per meal, zero seed oils, delivered hot in Delhi.">
<link rel="icon" type="image/png" href="/assets/img/logo-badge-64.png">
<link rel="apple-touch-icon" href="/assets/img/logo-badge-180.png">
<meta property="og:title" content="Protein Tadka — Built on Protein. Powered by Tadka.">
<meta property="og:description" content="High-protein chicken bowls, tadka mac, lean salads & 200g tofu bowls. Delivered hot in Delhi.">
<meta property="og:type" content="website">
<meta property="og:image" content="/assets/img/logo-badge-512.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="/assets/img/hero-bowl.webp">
<link rel="preload" as="image" href="/assets/img/logo-badge-256.webp">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Splash / loading screen: inline so it paints before any JS or CSS bundle -->
<style>
  #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:24px;text-align:center;color:#fff;overflow:hidden;
    background:
      radial-gradient(520px 340px at 50% 8%, rgba(255,209,0,.16), transparent 70%),
      radial-gradient(700px 500px at 50% 120%, rgba(242,106,35,.18), transparent 70%),
      #06251B;
    font-family:"Barlow Condensed",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    transition:opacity .5s ease,visibility .5s ease;-webkit-backdrop-filter:saturate(120%);backdrop-filter:saturate(120%)}
  #splash.hide{opacity:0;visibility:hidden;pointer-events:none}
  #splash .s-badge{width:96px;height:96px;border-radius:50%;background:#fff url('/assets/img/logo-badge-256.webp') center/82% no-repeat;
    box-shadow:0 14px 44px rgba(0,0,0,.45),0 0 0 0 rgba(255,209,0,.5);animation:sBadge .45s cubic-bezier(.2,.9,.3,1) both,sRing 1.9s ease-out .45s infinite}
  #splash .s-name{font-size:clamp(28px,7vw,44px);font-weight:800;letter-spacing:.14em;text-transform:uppercase;line-height:1;
    animation:sUp .4s .05s cubic-bezier(.2,.9,.3,1) both}
  #splash .s-name span{color:#FFD100}
  #splash .s-tag{font-size:clamp(12px,3.4vw,15px);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.62);font-weight:600;
    animation:sUp .4s .12s cubic-bezier(.2,.9,.3,1) both}
  #splash .s-bar{width:min(240px,62vw);height:4px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:10px;
    animation:sUp .4s .18s cubic-bezier(.2,.9,.3,1) both}
  #splash .s-bar i{display:block;height:100%;width:40%;border-radius:99px;
    background:linear-gradient(90deg,#FFD100,#F26A23);animation:sLoad 1.1s ease-in-out infinite}
  @keyframes sLoad{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
  @keyframes sBadge{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}
  @keyframes sRing{0%{box-shadow:0 14px 44px rgba(0,0,0,.45),0 0 0 0 rgba(255,209,0,.45)}70%{box-shadow:0 14px 44px rgba(0,0,0,.45),0 0 0 22px rgba(255,209,0,0)}100%{box-shadow:0 14px 44px rgba(0,0,0,.45),0 0 0 0 rgba(255,209,0,0)}}
  @keyframes sUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    #splash .s-badge,#splash .s-name,#splash .s-tag,#splash .s-bar{animation:none}
    #splash .s-bar i{width:100%;animation:none;transform:none}
  }
</style>
</head>
<body>
<div id="root"></div>

<div id="splash" role="status" aria-live="polite" aria-label="Loading Protein Tadka website">
  <div class="s-badge" aria-hidden="true"></div>
  <div class="s-name">Protein <span>Tadka</span></div>
  <div class="s-tag">Built on Protein · Powered by Tadka</div>
  <div class="s-bar" aria-hidden="true"><i></i></div>
</div>

<script type="module" src="/src/main.jsx"></script>
<noscript>
  <style>#splash{display:none}</style>
  <div style="max-width:640px;margin:60px auto;padding:0 20px;font-family:system-ui;text-align:center">
    <h1>Protein Tadka</h1>
    <p>Please enable JavaScript to view this website.</p>
  </div>
</noscript>
</body>
</html>
